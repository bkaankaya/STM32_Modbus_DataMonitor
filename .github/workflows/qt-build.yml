name: Qt build and protocol tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install Qt and build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake g++ qt6-base-dev qt6-serialport-dev qt6-tools-dev qt6-tools-dev-tools gcc-arm-none-eabi
      - name: Build desktop application
        run: |
          cmake -S embeddedGui -B build/qt -DCMAKE_BUILD_TYPE=Release
          cmake --build build/qt --parallel 2
      - name: Build STM32 firmware ELF from sources
        run: bash tests/build_stm32.sh build/stm32
      - name: Check STM32 application sources with ARM GCC
        run: |
          for src in stm32/Core/Src/main.c stm32/Core/Src/stm32f4xx_hal_msp.c stm32/Core/Src/stm32f4xx_it.c; do
            arm-none-eabi-gcc -std=gnu11 -mcpu=cortex-m4 -mthumb \
              -DUSE_HAL_DRIVER -DSTM32F407xx -fsyntax-only \
              -Istm32/Core/Inc \
              -Istm32/Drivers/STM32F4xx_HAL_Driver/Inc \
              -Istm32/Drivers/STM32F4xx_HAL_Driver/Inc/Legacy \
              -Istm32/Drivers/CMSIS/Device/ST/STM32F4xx/Include \
              -Istm32/Drivers/CMSIS/Include "$src"
          done
      - name: Test firmware Modbus request handler on host
        run: python3 tests/test_firmware_protocol.py
      - name: Run protocol regression tests (ASan/UBSan)
        run: |
          g++ -std=c++17 -Wall -Wextra -Werror -pedantic -fsanitize=address,undefined -fno-omit-frame-pointer tests/test_modbusframe.cpp -o build/test_modbusframe
          ./build/test_modbusframe
